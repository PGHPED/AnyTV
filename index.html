<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnyTV</title>

  <style>
    :root{
      --bg:#000000;
      --fg:#ffffff;
      --dim:#8a8a8a;
      --line:#2a2a2a;
      --hover:#151515;
    }
    *{ box-sizing:border-box; }
    html,body{
      margin:0; padding:0;
      background:var(--bg);
      color:var(--fg);
      font-family: ui-monospace, "SF Mono", "Consolas", "Menlo", monospace;
    }
    body{ padding-bottom:60px; }

    header{
      padding:20px 16px 12px;
      border-bottom:1px solid var(--line);
      position:sticky; top:0; background:var(--bg); z-index:10;
    }
    .brand{ font-size:22px; letter-spacing:2px; font-weight:700; margin:0 0 14px 0; }

    #controles{ display:flex; gap:10px; flex-wrap:wrap; }
    #pais, #buscador{
      background:var(--bg); border:1px solid var(--line); color:var(--fg);
      padding:10px 12px; font-family:inherit; font-size:14px; outline:none;
    }
    #pais{ min-width:180px; }
    #buscador{ flex:1; min-width:160px; }
    #pais:focus, #buscador:focus{ border-color:var(--fg); }
    #buscador::placeholder{ color:var(--dim); }

    #pantalla-wrap{ padding:16px; }
    #pantalla{
      width:100%; aspect-ratio:16/9; background:#000;
      border:1px solid var(--line); position:relative; overflow:hidden;
    }
    #pantalla video{ width:100%; height:100%; object-fit:contain; background:#000; }
    #sin-senal{
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      flex-direction:column; gap:8px;
      background: repeating-linear-gradient(0deg, #0a0a0a 0px, #0a0a0a 2px, #000 2px, #000 4px);
      color:var(--dim); font-size:12px; letter-spacing:2px; text-transform:uppercase;
      text-align:center; padding:20px;
    }
    #buffering{
      position:absolute; top:10px; left:10px;
      font-size:11px; letter-spacing:1px; color:var(--fg);
      background:rgba(0,0,0,0.7); border:1px solid var(--line);
      padding:4px 8px; display:none;
    }

    #info-canal{
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 2px 0; font-size:12px; color:var(--dim); gap:10px; flex-wrap:wrap;
    }
    #info-canal b{ color:var(--fg); font-size:14px; }
    #calidad{
      background:var(--bg); border:1px solid var(--line); color:var(--fg);
      font-family:inherit; font-size:12px; padding:4px 6px; outline:none;
    }

    #lista-wrap{ padding:4px 16px 16px; }
    #lista-titulo{
      font-size:12px; color:var(--dim); letter-spacing:2px;
      border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:4px;
    }
    ul#canales{ list-style:none; margin:0; padding:0; }
    ul#canales li{
      display:flex; align-items:center; gap:14px;
      padding:11px 6px; border-bottom:1px solid var(--line); cursor:pointer;
    }
    ul#canales li:hover{ background:var(--hover); }
    ul#canales li.activo{ background:var(--fg); color:var(--bg); }
    ul#canales li.activo .num, ul#canales li.activo .estado, ul#canales li.activo .pin{ color:var(--bg); }
    ul#canales li.offline{ opacity:0.45; }
    .num{ color:var(--dim); font-size:13px; min-width:26px; }
    .nombre{ font-size:14px; flex:1; }
    .pin{ font-size:11px; color:var(--dim); }
    .estado{ font-size:11px; letter-spacing:1px; color:var(--dim); min-width:78px; text-align:right; }
    .estado.online{ color:var(--fg); }

    #estado-pais{ color:var(--dim); font-size:13px; padding:20px 6px; text-align:center; }

    footer{
      position:fixed; bottom:0; left:0; right:0; border-top:1px solid var(--line);
      background:var(--bg); padding:8px 16px; font-size:11px; color:var(--dim);
      text-align:center; letter-spacing:1px;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="brand">AnyTV</h1>
    <div id="controles">
      <select id="pais"></select>
      <input id="buscador" type="text" placeholder="Search channel..." autocomplete="off">
    </div>
  </header>

  <div id="pantalla-wrap">
    <div id="pantalla">
      <video id="video" controls playsinline></video>
      <div id="buffering">BUFFERING...</div>
      <div id="sin-senal"><p>NO SIGNAL — PICK A CHANNEL</p></div>
    </div>
    <div id="info-canal">
      <span id="nombre-actual">—</span>
      <select id="calidad" style="display:none;"></select>
    </div>
  </div>

  <div id="lista-wrap">
    <div id="lista-titulo">CHANNELS</div>
    <div id="estado-pais">Loading...</div>
    <ul id="canales"></ul>
  </div>

  <footer>Free public channels via iptv-org · AnyTV</footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <script>
    /* =========================================================
       ANYTV
       Reproductor de TV en directo con canales gratuitos y
       públicos de iptv-org, organizados por país, con
       comprobación de estado online/offline por canal y
       ajustes para una reproducción más estable.
       ========================================================= */

    const PAISES = [
      { code: "es", label: "Spain" },
      { code: "gb", label: "United Kingdom" },
      { code: "us", label: "United States" },
      { code: "fr", label: "France" },
      { code: "de", label: "Germany" },
      { code: "it", label: "Italy" },
      { code: "pt", label: "Portugal" },
      { code: "mx", label: "Mexico" },
      { code: "ar", label: "Argentina" },
      { code: "br", label: "Brazil" },
      { code: "co", label: "Colombia" },
      { code: "cl", label: "Chile" },
      { code: "jp", label: "Japan" },
      { code: "kr", label: "South Korea" },
      { code: "in", label: "India" },
      { code: "au", label: "Australia" },
      { code: "ca", label: "Canada" },
      { code: "nl", label: "Netherlands" },
      { code: "tr", label: "Turkey" },
      { code: "eg", label: "Egypt" },
      { code: "za", label: "South Africa" },
      { code: "pl", label: "Poland" },
      { code: "se", label: "Sweden" },
      { code: "gr", label: "Greece" },
      { code: "id", label: "Indonesia" },
      { code: "ph", label: "Philippines" },
      { code: "sa", label: "Saudi Arabia" },
      { code: "ae", label: "United Arab Emirates" },
      { code: "ng", label: "Nigeria" },
    ];

    let canalesActuales = [];
    let hls = null;
    let reintentosRed = 0;
    const MAX_REINTENTOS = 3;

    // Cada vez que se elige un canal, este número sube uno.
    // Sirve para que, si cambias de canal muy rápido, las respuestas
    // "tardías" del canal anterior no toquen nada (evita choques raros
    // que pueden colgar el navegador).
    let sesionActual = 0;

    // Cache de estado online/offline por URL, para no repetir
    // comprobaciones cuando el usuario solo está filtrando la lista.
    const estadoCache = new Map();

    const $video      = document.getElementById("video");
    const $sinSenal    = document.getElementById("sin-senal");
    const $buffering   = document.getElementById("buffering");
    const $lista       = document.getElementById("canales");
    const $estadoPais  = document.getElementById("estado-pais");
    const $pais        = document.getElementById("pais");
    const $buscador    = document.getElementById("buscador");
    const $nombreAct   = document.getElementById("nombre-actual");
    const $calidad     = document.getElementById("calidad");

    // ---------- Construir el <select> de países ----------
    PAISES.forEach(p => {
      const opt = document.createElement("option");
      opt.value = p.code;
      opt.textContent = p.label;
      $pais.appendChild(opt);
    });
    $pais.addEventListener("change", () => cargarPais($pais.value));

    // ---------- Cargar los canales de un país ----------
    async function cargarPais(code){
      $estadoPais.textContent = "Loading channels...";
      $lista.innerHTML = "";
      canalesActuales = [];

      try{
        const url = `https://iptv-org.github.io/iptv/countries/${code}.m3u`;
        const res = await fetch(url);
        if(!res.ok) throw new Error("bad response");
        const texto = await res.text();
        let canales = parsearM3U(texto);

        if(canales.length === 0){
          $estadoPais.textContent = "No channels found for this country.";
          return;
        }

        canales = pinnearCanal(canales, /la\s*1\b/i);
        canalesActuales = canales;
        $estadoPais.textContent = "";
        pintarLista(canalesActuales);
      }catch(err){
        $estadoPais.textContent = "Could not load this country. Try another one.";
      }
    }

    function pinnearCanal(canales, patron){
      const idx = canales.findIndex(c => patron.test(c.nombre));
      if(idx > 0){
        const [fijado] = canales.splice(idx, 1);
        canales.unshift(fijado);
      }
      return canales;
    }

    function parsearM3U(texto){
      const lineas = texto.split("\n").map(l => l.trim());
      const canales = [];
      let nombreTmp = null;

      for(const linea of lineas){
        if(linea.startsWith("#EXTINF")){
          const partes = linea.split(",");
          nombreTmp = partes[partes.length - 1].trim();
        }else if(linea && !linea.startsWith("#")){
          if(nombreTmp){
            canales.push({ nombre: nombreTmp, url: linea });
            nombreTmp = null;
          }
        }
      }
      return canales;
    }

    // ---------- Pintar la lista de canales ----------
    function pintarLista(canales){
      $lista.innerHTML = "";
      const filas = [];

      canales.forEach((canal, i) => {
        const li = document.createElement("li");

        const num = document.createElement("span");
        num.className = "num";
        num.textContent = String(i + 1).padStart(2, "0");

        const nombre = document.createElement("span");
        nombre.className = "nombre";
        nombre.textContent = canal.nombre;

        const estado = document.createElement("span");
        estado.className = "estado";

        // Si ya sabemos el estado de este canal (por una comprobación
        // anterior), lo mostramos al instante en vez de volver a chequear.
        if(estadoCache.has(canal.url)){
          const online = estadoCache.get(canal.url);
          estado.textContent = online ? "● ONLINE" : "○ OFFLINE";
          if(online) estado.classList.add("online");
          if(!online) li.classList.add("offline");
        }else{
          estado.textContent = "· checking";
        }

        li.appendChild(num);
        li.appendChild(nombre);

        if(i === 0 && /la\s*1\b/i.test(canal.nombre)){
          const pin = document.createElement("span");
          pin.className = "pin";
          pin.textContent = "PINNED";
          li.appendChild(pin);
        }

        li.appendChild(estado);
        li.onclick = () => reproducir(canal, li);

        $lista.appendChild(li);
        filas.push({ canal, li });
      });

      // Solo comprobamos los canales que aún no están en la cache.
      const pendientes = filas.filter(f => !estadoCache.has(f.canal.url));
      verificarEstados(pendientes);
    }

    // ---------- Comprobación de estado online/offline ----------
    // Hace peticiones reales a cada canal, con un límite de 3 en
    // paralelo (menos que antes, para no saturar el navegador si
    // encima estás reproduciendo algo) y un timeout de 5s cada una.
    async function verificarEstados(filas){
      const cola = filas.slice();
      const trabajadores = Array.from({ length: 3 }, async () => {
        while(cola.length){
          const fila = cola.shift();
          await verificarUno(fila);
          // Pequeña pausa entre comprobaciones para no ir a saco
          await new Promise(r => setTimeout(r, 120));
        }
      });
      await Promise.all(trabajadores);
    }

    async function verificarUno(fila){
      const badge = fila.li.querySelector(".estado");
      const controlador = new AbortController();
      const timer = setTimeout(() => controlador.abort(), 5000);

      try{
        const res = await fetch(fila.canal.url, {
          method: "GET",
          mode: "cors",
          cache: "no-store",
          signal: controlador.signal,
        });
        // No basta con que responda: comprobamos que de verdad sea
        // un manifest de vídeo válido, para evitar falsos "online".
        const texto = await res.text();
        const esValido = res.ok && texto.trim().startsWith("#EXTM3U");

        estadoCache.set(fila.canal.url, esValido);
        if(badge){
          badge.textContent = esValido ? "● ONLINE" : "○ OFFLINE";
          badge.classList.toggle("online", esValido);
        }
        fila.li.classList.toggle("offline", !esValido);
      }catch(err){
        estadoCache.set(fila.canal.url, false);
        if(badge){ badge.textContent = "○ OFFLINE"; badge.classList.remove("online"); }
        fila.li.classList.add("offline");
      }finally{
        clearTimeout(timer);
      }
    }

    // ---------- Reproducir un canal ----------
    function reproducir(canal, elemento){
      // Nueva sesión: todo lo que pertenezca a una sesión antigua
      // se va a ignorar, aunque tarde en responder.
      sesionActual++;
      const miSesion = sesionActual;

      document.querySelectorAll("#canales li").forEach(li => li.classList.remove("activo"));
      elemento.classList.add("activo");

      $sinSenal.style.display = "none";
      $buffering.style.display = "none";
      $nombreAct.innerHTML = "<b>" + canal.nombre + "</b>";
      $calidad.style.display = "none";
      $calidad.innerHTML = "";
      reintentosRed = 0;

      if(hls){ hls.destroy(); hls = null; }
      $video.pause();
      $video.removeAttribute("src");
      $video.load();

      if($video.canPlayType("application/vnd.apple.mpegurl")){
        // Safari reproduce HLS de forma nativa (no usa hls.js)
        $video.src = canal.url;
        $video.play().catch(()=>{});
        return;
      }

      if(!(window.Hls && Hls.isSupported())){
        $sinSenal.style.display = "flex";
        $sinSenal.querySelector("p").textContent = "YOUR BROWSER CAN'T PLAY THIS";
        return;
      }

      try{
        hls = new Hls({
          enableWorker: true,           // el trabajo pesado va en un hilo aparte, más fluido
          capLevelToPlayerSize: true,   // no descarga más calidad de la que se ve en pantalla
          maxBufferLength: 20,          // segundos de vídeo guardados por delante
          maxMaxBufferLength: 30,
          backBufferLength: 20,         // segundos guardados por detrás (ya reproducidos)
          maxBufferSize: 30 * 1000 * 1000, // tope de ~30MB en memoria, para no dispararse
          liveSyncDurationCount: 3,
        });
      }catch(err){
        $sinSenal.style.display = "flex";
        $sinSenal.querySelector("p").textContent = "PLAYER ERROR — TRY ANOTHER CHANNEL";
        return;
      }

      hls.loadSource(canal.url);
      hls.attachMedia($video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        if(miSesion !== sesionActual) return; // ya se cambió de canal, ignorar
        $video.play().catch(()=>{});
        construirSelectorCalidad();
      });

      hls.on(Hls.Events.ERROR, (evt, data) => {
        if(miSesion !== sesionActual) return; // respuesta tardía de un canal viejo
        if(!data.fatal) return;

        if(reintentosRed < MAX_REINTENTOS){
          reintentosRed++;
          if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
            hls.startLoad();
            return;
          }
          if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
            hls.recoverMediaError();
            return;
          }
        }

        $sinSenal.style.display = "flex";
        $sinSenal.querySelector("p").textContent = "THIS CHANNEL IS DOWN — TRY ANOTHER";
      });
    }

    // ---------- Selector manual de calidad ----------
    function construirSelectorCalidad(){
      if(!hls || !hls.levels || hls.levels.length <= 1) return;

      $calidad.innerHTML = "";
      const auto = document.createElement("option");
      auto.value = "-1";
      auto.textContent = "Auto";
      $calidad.appendChild(auto);

      hls.levels.forEach((lvl, i) => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = (lvl.height ? lvl.height + "p" : Math.round(lvl.bitrate/1000) + " kbps");
        $calidad.appendChild(opt);
      });

      $calidad.value = "-1";
      $calidad.style.display = "inline-block";
      $calidad.onchange = () => { hls.currentLevel = Number($calidad.value); };
    }

    // ---------- Indicador de "buffering" ----------
    $video.addEventListener("waiting", () => { $buffering.style.display = "block"; });
    $video.addEventListener("playing", () => { $buffering.style.display = "none"; });

    // ---------- Buscador ----------
    $buscador.addEventListener("input", () => {
      const q = $buscador.value.toLowerCase().trim();
      if(!q){ pintarLista(canalesActuales); return; }
      const filtrados = canalesActuales.filter(c => c.nombre.toLowerCase().includes(q));
      pintarLista(filtrados);
    });

    // ---------- Al abrir la página: cargar España primero ----------
    cargarPais("es");
  </script>

</body>
</html>
